<script>

console.log("PERFECT COMPUTER ADMIN V3 loaded");


/* =========================================================
   GLOBAL
========================================================= */

const tokenKey = "perfectcomputer_admin_token";

let orders = [];
let filteredOrders = [];

let products = [];
let filteredProducts = [];

let currentTab = "orders";

let toastTimer;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function showApp(){

  $("loginScreen").classList.add("hidden");

  $("app").classList.remove("hidden");

}


function login(){

  const t =
    $("adminToken").value.trim();

  $("loginError").textContent = "";

  if(!t){

    $("loginError").textContent =
      "Please enter Admin Token.";

    return;
  }

  sessionStorage.setItem(
    tokenKey,
    t
  );

  showApp();

  loadOrders();

}


function logout(){

  sessionStorage.removeItem(
    tokenKey
  );

  orders = [];
  filteredOrders = [];

  products = [];
  filteredProducts = [];

  $("app").classList.add("hidden");

  $("loginScreen").classList.remove(
    "hidden"
  );

  $("adminToken").value = "";

}


function authHeaders(){

  return {

    "Authorization":
      "Bearer " +
      sessionStorage.getItem(
        tokenKey
      ),

    "Content-Type":
      "application/json"

  };

}


function showToast(message){

  const el =
    $("adminToast");

  if(!el) return;

  el.textContent =
    message;

  el.classList.add(
    "admin-toast-visible"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      ()=>{
        el.classList.remove(
          "admin-toast-visible"
        );
      },
      3000
    );

}


function escapeHtml(v){

  return String(v ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function formatMoney(n){

  return Number(
    n || 0
  ).toLocaleString(
    "en-IN",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function formatDate(v){

  if(!v) return "-";

  try{

    let x =
      String(v);

    if(
      !x.includes("T") &&
      !x.endsWith("Z")
    ){

      x =
        x.replace(
          " ",
          "T"
        ) +
        "Z";

    }

    const d =
      new Date(x);

    if(isNaN(d))
      return String(v);

    return d.toLocaleString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return String(v);

  }

}


function parseItems(x){

  try{

    return typeof x === "string"
      ? JSON.parse(x)
      : (x || []);

  }catch{

    return [];

  }

}

/* =========================================================
   ORDERS
========================================================= */

async function loadOrders(){

  $("tableArea").innerHTML =
    '<div class="center">' +
    '<div class="spinner"></div>' +
    'Loading orders...' +
    '</div>';

  try{

    const r =
      await fetch(
        "/api/admin/orders",
        {
          headers:
            authHeaders(),
          cache:
            "no-store"
        }
      );

    if(
      r.status === 401
    ){

      logout();

      $("loginError")
        .textContent =
        "Invalid Admin Token.";

      return;

    }

    const d =
      await r.json();

    if(!r.ok){

      throw Error(
        d.error ||
        "Could not load orders"
      );

    }

    orders =
      Array.isArray(
        d.orders
      )
      ? d.orders
      : [];

    updateStats();

    renderOrders();

  }catch(e){

    $("tableArea").innerHTML =
      '<div class="center">' +
      '<h3>⚠️ Could not load orders</h3>' +
      '<p>' +
      escapeHtml(
        e.message
      ) +
      '</p><br>' +
      '<button class="btn btn-primary" onclick="loadOrders()">Try Again</button>' +
      '</div>';

  }

}


function updateStats(){

  $("totalOrders")
    .textContent =
    orders.length;

  $("newOrders")
    .textContent =
    orders.filter(
      o =>
        String(
          o.order_status
        )
        .toLowerCase() ===
        "new"
    ).length;

  $("paidOrders")
    .textContent =
    orders.filter(
      o =>
        String(
          o.payment_status
        )
        .toLowerCase() ===
        "paid"
    ).length;

  $("codOrders")
    .textContent =
    orders.filter(
      o =>
        String(
          o.payment_status
        )
        .toLowerCase() ===
        "cod_pending"
    ).length;

}


function renderOrders(){

  const s =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const st =
    $("statusFilter")
      .value;

  const p =
    $("paymentFilter")
      .value;

  filteredOrders =
    orders.filter(
      o => {

        const txt = [

          o.order_number,
          o.customer_name,
          o.mobile,
          o.email,
          o.city,
          o.state,
          o.payment_status,
          o.order_status

        ]
        .join(" ")
        .toLowerCase();

        return (

          (!s ||
            txt.includes(s)
          ) &&

          (!st ||
            String(
              o.order_status
            )
            .toLowerCase() ===
            st
          ) &&

          (!p ||
            String(
              o.payment_status
            )
            .toLowerCase() ===
            p
          )

        );

      }
    );

  drawTable();

}

        '</div>' +

        '</td>' +

        ' item' +

          n === 1

        '</td>' +

        '<div class="amount">' +

        '</div>' +

        '<select class="status-select" ' +

        statusOptions(

        '</td>' +

        '<button class="action-btn whatsapp-btn" ' +
        'data-action="whatsapp" ' +
        'data-index="' +

        '">' +
        '📱 WhatsApp' +
        '</button>' +

        '<button class="action-btn invoice-btn" ' +
        'data-action="invoice" ' +
        'data-index="' +
        i +

function statusOptions(c){

  return [

    ["new","New"],
    ["confirmed","Confirmed"],
    ["shipped","Shipped"],
    ["delivered","Delivered"],
    ["cancelled","Cancelled"]

  ]
  .map(
    s =>

      '<option value="' +
      s[0] +
      '" ' +

      (
        String(c)
          .toLowerCase() ===
        s[0]
          ? "selected"
          : ""
      ) +

      '>' +

      s[1] +

      '</option>'

  )
  .join("");

}


async function changeStatus(
  num,
  status
){

  try{

    const r =
      await fetch(
        "/api/admin/order-status",
        {
          method:"POST",
          headers:
            authHeaders(),

          body:
            JSON.stringify({

              order_number:
                num,

              order_status:
                status

            })

        }
      );

    const d =
      await r.json();

    if(
      r.status === 401
    ){

      logout();

      return;

    }

    if(!r.ok){

      throw Error(
        d.error ||
        "Status update failed"
      );

    }

    const o =
      orders.find(
        x =>
          x.order_number ===
          num
      );

    if(o){

      o.order_status =
        status;

    }

    updateStats();

    renderOrders();

    showToast(
      "✅ Order status updated to " +
      status.toUpperCase()
    );

  }catch(e){

    alert(
      "Could not update order status:\n\n" +
      e.message
    );

    loadOrders();

  }

}

function paymentBadge(
  s,
  m
){

  s =
    String(s || "")
      .toLowerCase();

  if(s === "paid"){

    return (
      '<span class="badge badge-paid">' +
      '✓ PAID' +
      '</span>'
    );

  }

  if(
    s ===
    "cod_pending"
  ){

    return (
      '<span class="badge badge-cod">' +
      'COD PENDING' +
      '</span>'
    );

  }

  if(s === "created"){

    return (
      '<span class="badge badge-created">' +
      'ONLINE CREATED' +
      '</span>'
    );

  }

  if(s === "failed"){

    return (
      '<span class="badge badge-failed">' +
      'FAILED' +
      '</span>'
    );

  }

  return (
    '<span class="badge badge-pending">' +
    escapeHtml(
      m ||
      s ||
      "Pending"
    ) +
    '</span>'
  );

}


function getItemCount(x){

  const a =
    parseItems(x);

  return Array.isArray(a)
    ? a.reduce(
        (n,i)=>
          n +
          Number(
            i.quantity ||
            i.qty ||
            1
          ),
        0
      )
    : 0;

}


/* =========================================================
   CSV
========================================================= */

function csvEscape(v){

  const s =
    String(v ?? "");

  return (
    s.includes(",") ||
    s.includes('"') ||
    s.includes("\n")
  )

  ?

    '"' +
    s.replace(
      /"/g,
      '""'
    ) +
    '"'

  :

    s;

}


function exportCSV(){

  if(!orders.length){

    alert(
      "There are no orders to export."
    );

    return;

  }

  const rows = [

    [
      "Order Number",
      "Date",
      "Customer",
      "Mobile",
      "Email",
      "Address",
      "City",
      "State",
      "Pincode",
      "Amount",
      "Payment Method",
      "Payment Status",
      "Order Status",
      "Razorpay Order ID",
      "Razorpay Payment ID",
      "Courier",
      "Tracking Number",
      "Tracking URL"
    ]

  ];

  filteredOrders.forEach(
    o => {

      rows.push([

        o.order_number || "",
        o.created_at || "",
        o.customer_name || "",
        o.mobile || "",
        o.email || "",
        o.address || "",
        o.city || "",
        o.state || "",
        o.pincode || "",

        (
          Number(
            o.amount_paise ||
            0
          ) / 100
        ).toFixed(2),

        o.payment_method || "",
        o.payment_status || "",
        o.order_status || "",
        o.razorpay_order_id || "",
        o.razorpay_payment_id || "",
        o.courier_name || "",
        o.tracking_number || "",
        o.tracking_url || ""

      ]);

    }
  );

  const csv =
    rows
      .map(
        r =>
          r
            .map(csvEscape)
            .join(",")
      )
      .join("\r\n");

  const b =
    new Blob(
      ["\ufeff" + csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );

  const u =
    URL.createObjectURL(b);

  const a =
    document.createElement("a");

  a.href =
    u;

  a.download =
    "perfect-computer-orders-" +
    new Date()
      .toISOString()
      .slice(0,10) +
    ".csv";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(u);

  showToast(
    "📥 CSV exported successfully"
  );

}

async function postShipping(
  payload
){

  const response =
    await fetch(
      "/api/admin/shipping",
      {
        method:"POST",
        headers:
          authHeaders(),
        body:
          JSON.stringify(
            payload
          )
      }
    );

  let data = {};

  try{

    data =
      await response.json();

  }catch{}

  if(
    response.status ===
    401
  ){

    logout();

    throw new Error(
      "Admin session expired. Please login again."
    );

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      (
        "Shipping API returned HTTP " +
        response.status
      )
    );

  }

  return data;

}


function updateLocalShipping(
  orderNumber,
  payload
){

  const o =
    orders.find(
      x =>
        x.order_number ===
        orderNumber
    );

  if(o){

    o.courier_name =
      payload.courier_name;

    o.tracking_number =
      payload.tracking_number;

    o.tracking_url =
      payload.tracking_url;

  }

}


async function saveShipping(
  orderNumber
){

  const btn =
    $("saveShippingBtn");

  const payload =
    shippingPayload(
      orderNumber
    );

  if(btn){

    btn.disabled =
      true;

    btn.textContent =
      "Saving...";

  }

  try{

    await postShipping(
      payload
    );

    updateLocalShipping(
      orderNumber,
      payload
    );

    closeModal();

    renderOrders();

    showToast(
      "✅ Shipping information saved successfully"
    );

  }catch(error){

    if(btn){

      btn.disabled =
        false;

      btn.textContent =
        "💾 Save Shipping";

    }

    alert(
      "Shipping save failed:\n\n" +
      error.message
    );

  }

}


async function saveShippingAndShip(
  orderNumber
){

  const btn =
    $("shipOrderBtn");

  const payload =
    shippingPayload(
      orderNumber
    );

  if(btn){

    btn.disabled =
      true;

    btn.textContent =
      "Saving & Shipping...";

  }

  try{

    await postShipping(
      payload
    );

    updateLocalShipping(
      orderNumber,
      payload
    );

    const response =
      await fetch(
        "/api/admin/order-status",
        {
          method:"POST",
          headers:
            authHeaders(),

          body:
            JSON.stringify({

              order_number:
                orderNumber,

              order_status:
                "shipped"

            })

        }
      );

    let data = {};

    try{

      data =
        await response.json();

    }catch{}

    if(
      response.status ===
      401
    ){

      logout();

      throw new Error(
        "Admin session expired. Please login again."
      );

    }

    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        (
          "Status API returned HTTP " +
          response.status
        )
      );

    }

    const o =
      orders.find(
        x =>
          x.order_number ===
          orderNumber
      );

    if(o){

      o.order_status =
        "shipped";

    }

    closeModal();

    updateStats();

    renderOrders();

    showToast(
      "🚚 Order saved and marked SHIPPED"
    );

  }catch(error){

    if(btn){

      btn.disabled =
        false;

      btn.textContent =
        "🚚 Save & Mark Shipped";

    }

    alert(
      "Could not mark order as shipped:\n\n" +
      error.message
    );

  }

}


function buildShippingWhatsAppUrl(
  order,
  payload
){

  const phone =
    String(
      order.mobile ||
      ""
    ).replace(
      /\D/g,
      ""
    );

  if(!phone){

    throw new Error(
      "Customer mobile number is missing."
    );

  }

  const whatsappNumber =
    phone.length === 10
      ? "91" + phone
      : phone;

  let message =

`✓ Hello ${order.customer_name || "Customer"}!

→ Your PERFECT COMPUTER order has been shipped!

• Order: ${order.order_number || "-"}
• Amount: ₹${formatMoney(Number(order.amount_paise || 0)/100)}
→ Courier: ${payload.courier_name || "-"}
• Tracking No: ${payload.tracking_number || "-"}`;

  if(payload.tracking_url){

    message +=

`

→ Track Your Order:
${payload.tracking_url}`;

  }

  message +=

`

✓ Thank you for choosing PERFECT COMPUTER.

Smart Technology. Perfect Choice.`;

  return (
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(
      message
    )
  );

}


async function saveShippingAndWhatsApp(
  orderNumber
){

  const popup =
    window.open(
      "about:blank",
      "_blank"
    );

  const btn =
    $("shipWhatsAppBtn");

  const payload =
    shippingPayload(
      orderNumber
    );

  if(
    !payload.tracking_number
  ){

    if(popup)
      popup.close();

    alert(
      "Please enter Tracking Number."
    );

    return;

  }

  if(btn){

    btn.disabled =
      true;

    btn.textContent =
      "Saving...";

  }

  try{

    await postShipping(
      payload
    );

    const order =
      orders.find(
        x =>
          x.order_number ===
          orderNumber
      );

    if(!order){

      throw new Error(
        "Order not found."
      );

    }

    updateLocalShipping(
      orderNumber,
      payload
    );

    const whatsappUrl =
      buildShippingWhatsAppUrl(
        order,
        payload
      );

    closeModal();

    renderOrders();

    showToast(
      "✅ Shipping saved. Opening WhatsApp..."
    );

    if(popup){

      popup.location.href =
        whatsappUrl;

    }else{

      window.location.href =
        whatsappUrl;

    }

  }catch(error){

    if(popup)
      popup.close();

    if(btn){

      btn.disabled =
        false;

      btn.textContent =
        "📱 Save & WhatsApp Tracking";

    }

    alert(
      "Shipping / WhatsApp failed:\n\n" +
      error.message
    );

  }

}

async function loadProducts(){

  $("productsTableArea").innerHTML =
    '<div class="center">' +
    '<div class="spinner"></div>' +
    'Loading products...' +
    '</div>';

  try{

    const r =
      await fetch(
        "/api/admin/products",
        {
          headers:
            authHeaders(),
          cache:
            "no-store"
        }
      );

    if(
      r.status === 401
    ){

      logout();

      $("loginError")
        .textContent =
        "Invalid Admin Token.";

      return;

    }

    const d =
      await r.json();

    if(!r.ok){

      throw new Error(
        d.error ||
        d.message ||
        "Could not load products"
      );

    }

    products =
      Array.isArray(
        d.products
      )
      ? d.products
      : [];

    updateProductStats();

    updateProductCategoryFilter();

    renderProducts();

  }catch(error){

    $("productsTableArea")
      .innerHTML =

      '<div class="center">' +

      '<h3>⚠️ Could not load products</h3>' +

      '<p>' +
      escapeHtml(
        error.message
      ) +
      '</p><br>' +

      '<button class="btn btn-primary" onclick="loadProducts()">' +
      'Try Again' +
      '</button>' +

      '</div>';

  }

}


function updateProductStats(){

  $("totalProducts")
    .textContent =
    products.length;

  $("activeProducts")
    .textContent =
    products.filter(
      p =>
        String(
          p.status ||
          ""
        )
        .toLowerCase() ===
        "active"
    ).length;

  $("outOfStockProducts")
    .textContent =
    products.filter(
      p =>
        Number(
          p.stock_qty ||
          0
        ) <= 0
    ).length;

  const categories =
    new Set(
      products
        .map(
          p =>
            String(
              p.category ||
              ""
            ).trim()
        )
        .filter(Boolean)
    );

  $("productCategories")
    .textContent =
    categories.size;

}


function updateProductCategoryFilter(){

  const select =
    $("productCategoryFilter");

  const current =
    select.value;

  const categories =
    [
      ...new Set(
        products
          .map(
            p =>
              String(
                p.category ||
                ""
              ).trim()
          )
          .filter(Boolean)
      )
    ]
    .sort(
      (a,b)=>
        a.localeCompare(b)
    );

  select.innerHTML =
    '<option value="">All Categories</option>' +

    categories
      .map(
        c =>
          '<option value="' +
          escapeHtml(c) +
          '">' +
          escapeHtml(c) +
          '</option>'
      )
      .join("");

  if(
    categories.includes(
      current
    )
  ){

    select.value =
      current;

  }

}


function renderProducts(){

  const s =
    $("productSearch")
      .value
      .trim()
      .toLowerCase();

  const category =
    $("productCategoryFilter")
      .value;

  const status =
    $("productStatusFilter")
      .value;

  filteredProducts =
    products.filter(
      p => {

        const text =
          [
            p.name,
            p.brand,
            p.category,
            p.sku,
            p.description
          ]
          .join(" ")
          .toLowerCase();

        return (

          (!s ||
            text.includes(s)
          ) &&

          (!category ||
            String(
              p.category ||
              ""
            ) ===
            category
          ) &&

          (!status ||
            String(
              p.status ||
              ""
            )
            .toLowerCase() ===
            status
          )

        );

      }
    );

  drawProducts();

}

function openProductModal(
  product = null
){

  $("productForm")
    .reset();

  $("productId")
    .value = "";

  $("productStatus")
    .value =
    "active";

  $("productStock")
    .value =
    "0";

  if(product){

    $("productModalTitle")
      .textContent =
      "✏️ Edit Product";

    $("productId")
      .value =
      product.id ||
      "";

    $("productName")
      .value =
      product.name ||
      "";

    $("productBrand")
      .value =
      product.brand ||
      "";

    $("productCategory")
      .value =
      product.category ||
      "";

    $("productSku")
      .value =
      product.sku ||
      "";

    /*
      Database stores paise.
      Form displays rupees.
    */

    $("productPrice")
      .value =
      Number(
        product.price_paise ||
        0
      ) / 100;

    $("productMrp")
      .value =
      Number(
        product.mrp_paise ||
        0
      ) / 100;

    $("productStock")
      .value =
      product.stock_qty ||
      0;

    $("productStatus")
      .value =
      product.status ||
      "active";

    $("productImage")
      .value =
      product.image_url ||
      "";

    $("productDescription")
      .value =
      product.description ||
      "";

  }else{

    $("productModalTitle")
      .textContent =
      "➕ Add Product";

  }

  $("productModal")
    .classList
    .remove("hidden");

}


function closeProductModal(){

  $("productModal")
    .classList
    .add("hidden");

}


/* =========================================================
   FIXED PRODUCT FORM DATA
========================================================= */

function productFormData(){

  const price =
    Number(
      $("productPrice")
        .value || 0
    );

  const mrp =
    Number(
      $("productMrp")
        .value || 0
    );

  const stock =
    Number(
      $("productStock")
        .value || 0
    );

  /*
    IMPORTANT:

    Backend expects:

    price = rupees
    mrp   = rupees

    Backend itself converts:

    price * 100 -> price_paise
    mrp   * 100 -> mrp_paise
  */

  return {

    name:
      $("productName")
        .value
        .trim(),

    brand:
      $("productBrand")
        .value
        .trim(),

    category:
      $("productCategory")
        .value
        .trim(),

    sku:
      $("productSku")
        .value
        .trim(),

    description:
      $("productDescription")
        .value
        .trim(),

    image_url:
      $("productImage")
        .value
        .trim(),

    /* FIX */
    price:
      price,

    /* FIX */
    mrp:
      mrp,

    stock_qty:
      Math.max(
        0,
        Math.floor(stock)
      ),

    status:
      $("productStatus")
        .value

  };

}

  const id =
    $("productId")
      .value
      .trim();

  const data =
    productFormData();


  /* PRODUCT NAME */

  if(!data.name){

    alert(
      "Please enter Product Name."
    );

    return;

  }


  /* CATEGORY */

  if(!data.category){

    alert(
      "Please enter Category."
    );

    return;

  }


  /* SELLING PRICE */

  if(
    !Number.isFinite(
      data.price
    ) ||
    data.price < 0
  ){

    alert(
      "Please enter a valid Selling Price."
    );

    return;

  }


  /* MRP */

  if(
    !Number.isFinite(
      data.mrp
    ) ||
    data.mrp < 0
  ){

    alert(
      "Please enter a valid MRP."
    );

    return;

  }


  /* STOCK */

  if(
    !Number.isInteger(
      data.stock_qty
    ) ||
    data.stock_qty < 0
  ){

    alert(
      "Please enter a valid Stock Quantity."
    );

    return;

  }


  btn.disabled =
    true;

  btn.textContent =
    "Saving...";


  try{

    const method =
      id
        ? "PUT"
        : "POST";


    const body =
      id

        ?

        {
          id:
            Number(id),

          ...data
        }

        :

        data;


    console.log(
      "Product API payload:",
      body
    );


    const r =
      await fetch(
        "/api/admin/products",
        {
          method:
            method,

          headers:
            authHeaders(),

          body:
            JSON.stringify(
              body
            )
        }
      );


    let result = {};


    try{

      result =
        await r.json();

    }catch{}


    if(
      r.status ===
      401
    ){

      logout();

      throw new Error(
        "Admin session expired. Please login again."
      );

    }


    if(!r.ok){

      throw new Error(
        result.error ||
        result.message ||
        (
          "Product API returned HTTP " +
          r.status
        )
      );

    }


    closeProductModal();


    showToast(
      id

        ?

        "✅ Product updated successfully"

        :

        "✅ Product added successfully"
    );


    await loadProducts();


  }catch(error){

    console.error(
      "Product save error:",
      error
    );

    alert(
      "Could not save product:\n\n" +
      error.message
    );

  }finally{

    btn.disabled =
      false;

    btn.textContent =
      "💾 Save Product";

  }

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(
  product
){

  if(!product)
    return;

  const ok =
    confirm(

      "Delete this product?\n\n" +

      product.name +

      "\n\nThis action cannot be undone."

    );

  if(!ok)
    return;

  try{

    const r =
      await fetch(
        "/api/admin/products",
        {
          method:
            "DELETE",

          headers:
            authHeaders(),

          body:
            JSON.stringify({
              id:
                Number(
                  product.id
                )
            })
        }
      );

    let d = {};

    try{

      d =
        await r.json();

    }catch{}

    if(
      r.status ===
      401
    ){

      logout();

      return;

    }

    if(!r.ok){

      throw new Error(
        d.error ||
        d.message ||
        (
          "Delete API returned HTTP " +
          r.status
        )
      );

    }

    showToast(
      "🗑 Product deleted successfully"
    );

    await loadProducts();

  }catch(error){

    alert(
      "Could not delete product:\n\n" +
      error.message
    );

  }

}

document.addEventListener(
  "click",
  function(event){

    const btn =
      event.target.closest(
        "[data-product-action]"
      );

    if(!btn)
      return;

    const action =
      btn.getAttribute(
        "data-product-action"
      );

    const index =
      Number(
        btn.getAttribute(
          "data-product-index"
        )
      );

    const product =
      filteredProducts[index];

    if(!product)
      return;

    if(
      action ===
      "edit"
    ){

      openProductModal(
        product
      );

    }

    else if(
      action ===
      "delete"
    ){

      deleteProduct(
        product
      );

    }

  }
);
