<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERFECT COMPUTER Admin</title>
</head>

<body style="font-family:Arial,sans-serif;background:#f3f6fa;margin:0;padding:40px">

  <div style="max-width:700px;margin:auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 25px #ccc">
    
    <h1>🔐 PERFECT COMPUTER</h1>
    <h2>Admin Panel Test</h2>

    <p style="color:green;font-size:18px">
      ✅ ADMIN.HTML IS WORKING
    </p>

    <hr>

    <label>Admin Token</label><br><br>

    <input 
      type="password"
      id="token"
      placeholder="Enter Admin Token"
      style="width:100%;padding:14px;box-sizing:border-box"
    >

    <br><br>

    <button
      onclick="test()"
      style="padding:14px 25px;background:#111;color:white;border:0;border-radius:8px;cursor:pointer"
    >
      LOGIN TEST
    </button>

    <p id="result"></p>

  </div>

<script>
function test() {
  const token = document.getElementById("token").value;

  if (!token) {
    document.getElementById("result").innerHTML =
      "⚠️ Token enter karo";
    return;
  }

  document.getElementById("result").innerHTML =
    "🔄 Token received. Admin API test next step...";
}
</script>

</body>
</html>
