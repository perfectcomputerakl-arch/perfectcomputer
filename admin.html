<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERFECT COMPUTER — Admin Panel V2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#07111f,#102d50)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:35px;box-shadow:0 25px 70px rgba(0,0,0,.3)}
.logo{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#1264ff;color:#fff;font-size:28px;font-weight:900;margin-bottom:20px}
.login-card h1{font-size:27px;margin-bottom:7px}.login-card p{color:#6b7280;margin-bottom:25px}.form-label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.input{width:100%;padding:14px 15px;border:1px solid #d7deea;border-radius:11px;outline:none;background:#fff}.input:focus{border-color:#1264ff;box-shadow:0 0 0 3px rgba(18,100,255,.1)}
.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:700}.btn-primary{background:#1264ff;color:#fff}.btn-light{background:#eef2f7;color:#172033}.btn-success{background:#dcfce7;color:#15803d}.full{width:100%}.error{color:#dc2626;font-size:14px;margin-top:12px}
#app{min-height:100vh}.topbar{height:72px;background:#07111f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#1264ff;font-weight:900}.brand-title{font-size:17px;font-weight:900}.brand-sub{font-size:11px;color:#9ca3af}.top-actions{display:flex;gap:8px}
.container{max-width:1450px;margin:auto;padding:25px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.page-head h2{font-size:28px}.page-head p{color:#6b7280;margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat{background:#fff;border:1px solid #e4e9f1;border-radius:17px;padding:20px;box-shadow:0 4px 18px rgba(15,23,42,.04)}.stat-label{color:#6b7280;font-size:13px;font-weight:700}.stat-value{font-size:28px;font-weight:900;margin-top:8px}
.panel{background:#fff;border:1px solid #e4e9f1;border-radius:17px;overflow:hidden;box-shadow:0 4px 18px rgba(15,23,42,.04)}.toolbar{padding:17px;border-bottom:1px solid #e8edf4;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px}.select{min-width:170px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th{background:#f8fafc;text-align:left;padding:14px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.4px}td{padding:15px 14px;border-top:1px solid #edf1f5;vertical-align:middle;font-size:14px}
.order-no{font-weight:900;color:#1264ff}.customer{font-weight:800}.muted{color:#64748b;font-size:12px;margin-top:3px}.amount{font-weight:900}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.badge-paid{background:#dcfce7;color:#15803d}.badge-pending{background:#fef3c7;color:#a16207}.badge-created{background:#dbeafe;color:#1d4ed8}.badge-failed{background:#fee2e2;color:#b91c1c}.badge-cod{background:#ede9fe;color:#6d28d9}
.status-select{padding:8px;border:1px solid #dbe2ea;border-radius:8px;background:#fff;font-size:12px;font-weight:700}.view-btn{padding:8px 11px;border:0;background:#eef2ff;color:#3730a3;border-radius:8px;font-weight:800}.order-actions{display:flex;gap:7px;flex-wrap:wrap}.action-btn{border:0;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:800}.whatsapp-btn{background:#dcfce7;color:#15803d}.invoice-btn{background:#dbeafe;color:#1d4ed8}.shipping-btn{background:#fef3c7;color:#92400e}
.center{text-align:center;padding:50px 20px;color:#64748b}.spinner{width:30px;height:30px;border:3px solid #dbe4f0;border-top-color:#1264ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(2,8,23,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.modal-card{width:100%;max-width:850px;max-height:90vh;overflow:auto;background:#fff;border-radius:20px}.modal-head{padding:20px;border-bottom:1px solid #e5eaf0;display:flex;justify-content:space-between;align-items:center}.close{width:36px;height:36px;border:0;border-radius:9px;background:#eef2f7;font-size:20px}.modal-body{padding:20px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.detail{border:1px solid #e5eaf0;border-radius:12px;padding:14px}.detail-label{color:#64748b;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:5px}.detail-value{font-weight:700;word-break:break-word}.items-box,.tracking-box{margin-top:18px;border:1px solid #e5eaf0;border-radius:12px;overflow:hidden}.items-title,.tracking-title{padding:12px 14px;background:#f8fafc;font-weight:900}.item-row{display:flex;justify-content:space-between;gap:15px;padding:13px 14px;border-top:1px solid #edf1f5}.shipping-form{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.shipping-form .full-row{grid-column:1/-1}.shipping-actions{display:flex;gap:8px;flex-wrap:wrap}
#adminToast{position:fixed;right:20px;bottom:20px;z-index:200;background:#172033;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease,visibility .18s}.admin-toast-visible{opacity:1!important;visibility:visible!important;transform:translateY(0)!important}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.page-head{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.topbar{padding:0 14px}.brand-sub{display:none}.container{padding:15px}.page-head h2{font-size:23px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px}.stat-value{font-size:23px}.detail-grid{grid-template-columns:1fr}.shipping-form{grid-template-columns:1fr}.shipping-form .full-row{grid-column:auto}.top-actions .btn{padding:9px 10px}}
</style>
</head>
<body>
<section id="loginScreen"><div class="login-card"><div class="logo">PC</div><h1>PERFECT COMPUTER</h1><p>Secure Admin Order Panel</p><label class="form-label">Admin Token</label><input id="adminToken" class="input" type="password" placeholder="Enter your Admin Token" autocomplete="off"><br><br><button class="btn btn-primary full" onclick="login()">🔐 Login to Admin Panel</button><div id="loginError" class="error"></div></div></section>
<section id="app" class="hidden"><header class="topbar"><div class="brand"><div class="brand-icon">PC</div><div><div class="brand-title">PERFECT COMPUTER</div><div class="brand-sub">Smart Technology. Perfect Choice.</div></div></div><div class="top-actions"><button class="btn btn-light" onclick="loadOrders()">🔄 Refresh</button><button class="btn btn-light" onclick="logout()">Logout</button></div></header>
<main class="container"><div class="page-head"><div><h2>📦 Order Management</h2><p>Manage customer orders, payments and delivery status.</p></div><button class="btn btn-success" onclick="exportCSV()">📥 Export CSV</button></div>
<div class="stats"><div class="stat"><div class="stat-label">TOTAL ORDERS</div><div id="totalOrders" class="stat-value">0</div></div><div class="stat"><div class="stat-label">NEW ORDERS</div><div id="newOrders" class="stat-value">0</div></div><div class="stat"><div class="stat-label">ONLINE PAID</div><div id="paidOrders" class="stat-value">0</div></div><div class="stat"><div class="stat-label">COD PENDING</div><div id="codOrders" class="stat-value">0</div></div></div>
<div class="panel"><div class="toolbar"><input id="search" class="input search" type="search" placeholder="🔎 Search order, customer, mobile..." oninput="renderOrders()"><select id="statusFilter" class="input select" onchange="renderOrders()"><option value="">All Order Status</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select><select id="paymentFilter" class="input select" onchange="renderOrders()"><option value="">All Payments</option><option value="paid">Paid</option><option value="cod_pending">COD Pending</option><option value="created">Created</option></select></div><div id="tableArea"><div class="center"><div class="spinner"></div>Loading orders...</div></div></div></main></section>
<div id="orderModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3>📋 Order Details</h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody" class="modal-body"></div></div></div><div id="adminToast" aria-live="polite"></div>
<script>
console.log("PERFECT COMPUTER ADMIN V2 loaded");

const tokenKey="perfectcomputer_admin_token";let orders=[],filteredOrders=[],toastTimer;
function showApp(){loginScreen.classList.add("hidden");app.classList.remove("hidden")}
function login(){const t=adminToken.value.trim();loginError.textContent="";if(!t){loginError.textContent="Please enter Admin Token.";return}sessionStorage.setItem(tokenKey,t);showApp();loadOrders()}
function logout(){sessionStorage.removeItem(tokenKey);orders=[];filteredOrders=[];app.classList.add("hidden");loginScreen.classList.remove("hidden");adminToken.value=""}
function authHeaders(){return{"Authorization":"Bearer "+sessionStorage.getItem(tokenKey),"Content-Type":"application/json"}}
async function loadOrders(){tableArea.innerHTML='<div class="center"><div class="spinner"></div>Loading orders...</div>';try{const r=await fetch("/api/admin/orders",{headers:authHeaders(),cache:"no-store"});if(r.status===401){logout();loginError.textContent="Invalid Admin Token.";return}const d=await r.json();if(!r.ok)throw Error(d.error||"Could not load orders");orders=Array.isArray(d.orders)?d.orders:[];updateStats();renderOrders()}catch(e){tableArea.innerHTML='<div class="center"><h3>⚠️ Could not load orders</h3><p>'+escapeHtml(e.message)+'</p><br><button class="btn btn-primary" onclick="loadOrders()">Try Again</button></div>'}}
function updateStats(){totalOrders.textContent=orders.length;newOrders.textContent=orders.filter(o=>String(o.order_status).toLowerCase()==="new").length;paidOrders.textContent=orders.filter(o=>String(o.payment_status).toLowerCase()==="paid").length;codOrders.textContent=orders.filter(o=>String(o.payment_status).toLowerCase()==="cod_pending").length}
function renderOrders(){const s=search.value.trim().toLowerCase(),st=statusFilter.value,p=paymentFilter.value;filteredOrders=orders.filter(o=>{const txt=[o.order_number,o.customer_name,o.mobile,o.email,o.city,o.state,o.payment_status,o.order_status].join(" ").toLowerCase();return(!s||txt.includes(s))&&(!st||String(o.order_status).toLowerCase()===st)&&(!p||String(o.payment_status).toLowerCase()===p)});drawTable()}
function drawTable(){if(!filteredOrders.length){tableArea.innerHTML='<div class="center"><h3>📭 No orders found</h3><p>Try changing your search or filters.</p></div>';return}let h='<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Order Status</th><th>Date</th><th>Action</th></tr></thead><tbody>';filteredOrders.forEach((o,i)=>{const n=getItemCount(o.items_json);h+='<tr><td><div class="order-no">'+escapeHtml(o.order_number||"-")+'</div><div class="muted">ID #'+escapeHtml(o.id??"-")+'</div></td><td><div class="customer">'+escapeHtml(o.customer_name||"-")+'</div><div class="muted">'+escapeHtml(o.mobile||"")+'</div></td><td>'+n+' item'+(n===1?"":"s")+'</td><td><div class="amount">₹'+formatMoney(Number(o.amount_paise||0)/100)+'</div></td><td>'+paymentBadge(o.payment_status,o.payment_method)+'</td><td><select class="status-select" onchange="changeStatus('+JSON.stringify(o.order_number||"")+',this.value)">'+statusOptions(o.order_status)+'</select></td><td>'+formatDate(o.created_at)+'</td><td><div class="order-actions"><button class="action-btn whatsapp-btn" data-action="whatsapp" data-index="'+i+'">📱 WhatsApp</button><button class="action-btn invoice-btn" data-action="invoice" data-index="'+i+'">🧾 Invoice</button><button class="action-btn shipping-btn" data-action="shipping" data-index="'+i+'">🚚 Shipping</button><button class="view-btn" data-action="view" data-index="'+i+'">👁 View</button></div></td></tr>'});tableArea.innerHTML=h+"</tbody></table></div>"}
function statusOptions(c){return[["new","New"],["confirmed","Confirmed"],["shipped","Shipped"],["delivered","Delivered"],["cancelled","Cancelled"]].map(s=>'<option value="'+s[0]+'" '+(String(c).toLowerCase()===s[0]?"selected":"")+'>'+s[1]+"</option>").join("")}
async function changeStatus(num,status){try{const r=await fetch("/api/admin/order-status",{method:"POST",headers:authHeaders(),body:JSON.stringify({order_number:num,order_status:status})});const d=await r.json();if(r.status===401){logout();return}if(!r.ok)throw Error(d.error||"Status update failed");const o=orders.find(x=>x.order_number===num);if(o)o.order_status=status;updateStats();renderOrders();showToast("✅ Order status updated to "+status.toUpperCase())}catch(e){alert("Could not update order status:\\n\\n"+e.message);loadOrders()}}
function parseItems(x){try{return typeof x==="string"?JSON.parse(x):(x||[])}catch{return[]}}
function detail(l,v){return'<div class="detail"><div class="detail-label">'+escapeHtml(l)+'</div><div class="detail-value">'+escapeHtml(v==null||v===""?"-":String(v))+"</div></div>"}
function viewOrder(i){const o=filteredOrders[i];if(!o)return;const items=parseItems(o.items_json);let ih=Array.isArray(items)&&items.length?items.map((x,j)=>{const q=Number(x.quantity||x.qty||1),p=Number(x.price||0);return'<div class="item-row"><div><strong>'+escapeHtml(x.name||x.title||"Product")+'</strong><div class="muted">Qty: '+q+'</div></div><strong>₹'+formatMoney(p*q)+"</strong></div>"}).join(""):'<div class="item-row">No item details available.</div>';modalBody.innerHTML='<div class="detail-grid">'+detail("Order Number",o.order_number)+detail("Order Date",formatDate(o.created_at))+detail("Customer",o.customer_name)+detail("Mobile",o.mobile)+detail("Email",o.email||"-")+detail("Amount","₹"+formatMoney(Number(o.amount_paise||0)/100))+detail("Payment Method",o.payment_method)+detail("Payment Status",o.payment_status)+detail("Order Status",o.order_status)+detail("Razorpay Order ID",o.razorpay_order_id||"-")+detail("Razorpay Payment ID",o.razorpay_payment_id||"-")+detail("Pincode",o.pincode)+detail("City",o.city)+detail("State",o.state)+detail("Address",o.address)+'</div><div class="items-box"><div class="items-title">🛒 Ordered Products</div>'+ih+"</div>";orderModal.classList.remove("hidden")}
function closeModal(){orderModal.classList.add("hidden")}
function paymentBadge(s,m){s=String(s||"").toLowerCase();if(s==="paid")return'<span class="badge badge-paid">✓ PAID</span>';if(s==="cod_pending")return'<span class="badge badge-cod">COD PENDING</span>';if(s==="created")return'<span class="badge badge-created">ONLINE CREATED</span>';if(s==="failed")return'<span class="badge badge-failed">FAILED</span>';return'<span class="badge badge-pending">'+escapeHtml(m||s||"Pending")+"</span>"}
function getItemCount(x){const a=parseItems(x);return Array.isArray(a)?a.reduce((n,i)=>n+Number(i.quantity||i.qty||1),0):0}
function formatMoney(n){return Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function formatDate(v){if(!v)return"-";try{let x=String(v);if(!x.includes("T")&&!x.endsWith("Z"))x=x.replace(" ","T")+"Z";const d=new Date(x);if(isNaN(d))return String(v);return d.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch{return String(v)}}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function showToast(m){const toastEl=document.getElementById("adminToast");if(!toastEl)return;toastEl.textContent=m;toastEl.classList.add("admin-toast-visible");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("admin-toast-visible"),3000)}
function csvEscape(v){const s=String(v??"");return s.includes(",")||s.includes('"')||s.includes("\\n")?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){if(!orders.length){alert("There are no orders to export.");return}const rows=[["Order Number","Date","Customer","Mobile","Email","Address","City","State","Pincode","Amount","Payment Method","Payment Status","Order Status","Razorpay Order ID","Razorpay Payment ID","Courier","Tracking Number","Tracking URL"]];filteredOrders.forEach(o=>rows.push([o.order_number||"",o.created_at||"",o.customer_name||"",o.mobile||"",o.email||"",o.address||"",o.city||"",o.state||"",o.pincode||"",(Number(o.amount_paise||0)/100).toFixed(2),o.payment_method||"",o.payment_status||"",o.order_status||"",o.razorpay_order_id||"",o.razorpay_payment_id||"",o.courier_name||"",o.tracking_number||"",o.tracking_url||""]));const csv=rows.map(r=>r.map(csvEscape).join(",")).join("\\r\\n"),b=new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8;"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="perfect-computer-orders-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);showToast("📥 CSV exported successfully")}

/* SHIPPING */
function openShipping(i){
  const o=filteredOrders[i];
  if(!o)return;

  modalBody.innerHTML =
    '<h3 style="margin-bottom:15px;">🚚 Shipping / Tracking</h3>'+
    '<div class="detail-grid">'+
      detail("Order Number",o.order_number)+
      detail("Customer",o.customer_name)+
      detail("Mobile",o.mobile)+
      detail("Current Status",o.order_status)+
    '</div>'+
    '<div class="tracking-box">'+
      '<div class="tracking-title">🚚 Courier Information</div>'+
      '<div class="shipping-form">'+
        '<div><label class="form-label">Courier Name</label>'+
        '<input id="courierName" class="input" placeholder="Delhivery / DTDC / Blue Dart" value="'+escapeHtml(o.courier_name||"")+'"></div>'+
        '<div><label class="form-label">Tracking Number</label>'+
        '<input id="trackingNumber" class="input" placeholder="Enter tracking number" value="'+escapeHtml(o.tracking_number||"")+'"></div>'+
        '<div class="full-row"><label class="form-label">Tracking URL</label>'+
        '<input id="trackingUrl" class="input" type="url" placeholder="https://..." value="'+escapeHtml(o.tracking_url||"")+'"></div>'+
        '<div class="full-row shipping-actions">'+
          '<button id="saveShippingBtn" class="btn btn-primary">💾 Save Shipping</button>'+
          '<button id="shipOrderBtn" class="btn btn-success">🚚 Save & Mark Shipped</button>'+
          '<button id="shipWhatsAppBtn" class="btn btn-success">📱 Save & WhatsApp Tracking</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  orderModal.classList.remove("hidden");

  document.getElementById("saveShippingBtn").addEventListener("click",()=>saveShipping(o.order_number));
  document.getElementById("shipOrderBtn").addEventListener("click",()=>saveShippingAndShip(o.order_number));
  document.getElementById("shipWhatsAppBtn").addEventListener("click",()=>saveShippingAndWhatsApp(o.order_number));
}

function shippingPayload(orderNumber){
  return {
    order_number: orderNumber,
    courier_name: (document.getElementById("courierName")?.value||"").trim(),
    tracking_number: (document.getElementById("trackingNumber")?.value||"").trim(),
    tracking_url: (document.getElementById("trackingUrl")?.value||"").trim()
  };
}

async function postShipping(payload){
  const response=await fetch("/api/admin/shipping",{
    method:"POST",
    headers:authHeaders(),
    body:JSON.stringify(payload)
  });

  let data={};
  try{data=await response.json();}catch{}

  if(response.status===401){
    logout();
    throw new Error("Admin session expired. Please login again.");
  }
  if(!response.ok){
    throw new Error(data.error||data.message||("Shipping API returned HTTP "+response.status));
  }
  return data;
}

function updateLocalShipping(orderNumber,payload){
  const o=orders.find(x=>x.order_number===orderNumber);
  if(o){
    o.courier_name=payload.courier_name;
    o.tracking_number=payload.tracking_number;
    o.tracking_url=payload.tracking_url;
  }
}

async function saveShipping(orderNumber){
  const btn=document.getElementById("saveShippingBtn");
  const payload=shippingPayload(orderNumber);

  if(btn){btn.disabled=true;btn.textContent="Saving...";}

  try{
    await postShipping(payload);
    updateLocalShipping(orderNumber,payload);
    closeModal();
    renderOrders();
    showToast("✅ Shipping information saved successfully");
    return true;
  }catch(error){
    if(btn){btn.disabled=false;btn.textContent="💾 Save Shipping";}
    alert("Shipping save failed:\n\n"+error.message);
    return false;
  }
}

async function saveShippingAndShip(orderNumber){
  const btn=document.getElementById("shipOrderBtn");
  const payload=shippingPayload(orderNumber);

  if(btn){btn.disabled=true;btn.textContent="Saving & Shipping...";}

  try{
    await postShipping(payload);
    updateLocalShipping(orderNumber,payload);

    const response=await fetch("/api/admin/order-status",{
      method:"POST",
      headers:authHeaders(),
      body:JSON.stringify({
        order_number:orderNumber,
        order_status:"shipped"
      })
    });

    let data={};
    try{data=await response.json();}catch{}

    if(response.status===401){
      logout();
      throw new Error("Admin session expired. Please login again.");
    }
    if(!response.ok){
      throw new Error(data.error||data.message||("Status API returned HTTP "+response.status));
    }

    const o=orders.find(x=>x.order_number===orderNumber);
    if(o)o.order_status="shipped";

    closeModal();
    updateStats();
    renderOrders();
    showToast("🚚 Order saved and marked SHIPPED");
    return true;
  }catch(error){
    if(btn){btn.disabled=false;btn.textContent="🚚 Save & Mark Shipped";}
    alert("Could not mark order as shipped:\n\n"+error.message);
    return false;
  }
}

function buildShippingWhatsAppUrl(order,payload){
  const phone=String(order.mobile||"").replace(/\D/g,"");
  if(!phone)throw new Error("Customer mobile number is missing.");

  const whatsappNumber=phone.length===10?"91"+phone:phone;
  const hello="[HELLO]";
  const truck="[SHIPPED]";
  const box="[ORDER]";
  const money="[AMOUNT]";
  const searchIcon="[TRACKING]";
  const link="[TRACK LINK]";
  const thanks="[THANK YOU]";

  let message=
`${hello} Hello ${order.customer_name||"Customer"}!

${truck} Your PERFECT COMPUTER order has been shipped!

${box} Order: ${order.order_number||"-"}
${money} Amount: ₹${formatMoney(Number(order.amount_paise||0)/100)}

async function saveShippingAndWhatsApp(orderNumber){
  // Open the window immediately from the user click so Chrome/Edge popup blocking
  // does not prevent WhatsApp from opening after the API request finishes.
  const popup=window.open("about:blank","_blank");

  const btn=document.getElementById("shipWhatsAppBtn");
  const payload=shippingPayload(orderNumber);

  if(!payload.tracking_number){
    if(popup)popup.close();
    alert("Please enter Tracking Number.");
    return;
  }

  if(btn){btn.disabled=true;btn.textContent="Saving...";}

  try{
    await postShipping(payload);

    const order=orders.find(x=>x.order_number===orderNumber);
    if(!order)throw new Error("Order not found.");

    updateLocalShipping(orderNumber,payload);

    const whatsappUrl=buildShippingWhatsAppUrl(order,payload);

    closeModal();
    renderOrders();
    showToast("✅ Shipping saved. Opening WhatsApp...");

    if(popup){
      popup.location.href=whatsappUrl;
    }else{
      window.location.href=whatsappUrl;
    }
  }catch(error){
    if(popup)popup.close();
    if(btn){btn.disabled=false;btn.textContent="📱 Save & WhatsApp Tracking";}
    alert("Shipping / WhatsApp failed:\n\n"+error.message);
  }
}

  const action=btn.getAttribute("data-action");
  const index=Number(btn.getAttribute("data-index"));

  if(action==="whatsapp")whatsappCustomer(index);
  else if(action==="invoice")generateInvoice(index);
  else if(action==="shipping")openShipping(index);

});
